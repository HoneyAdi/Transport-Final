{% extends 'base.html' %}

{% block title %}{{ 'Edit' if edit else 'Create' }} Tenant - Transport Management System{% endblock %}

{% block content %}
<div class="navbar-top">
    <h4 class="mb-0"><i class="bi bi-buildings"></i> {{ 'Edit' if edit else 'Create' }} Tenant</h4>
</div>

<div class="card">
    <div class="card-body p-4">
        <form method="POST">
            <h6 class="text-primary mb-3">Tenant Details</h6>
            <div class="row g-3 mb-4">
                <div class="col-md-4">
                    <label class="form-label">Tenant Name <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" name="name" value="{{ tenant.name if edit else '' }}" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Slug <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" name="slug" value="{{ tenant.slug if edit else '' }}" required placeholder="lowercase-with-hyphens">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Contact Email</label>
                    <input type="email" class="form-control" name="contact_email" value="{{ tenant.contact_email if edit else '' }}">
                </div>
            </div>

            <div class="form-check form-switch mb-4">
                <input class="form-check-input" type="checkbox" id="is_active" name="is_active" {% if (edit and tenant.is_active) or not edit %}checked{% endif %}>
                <label class="form-check-label" for="is_active">Tenant is active</label>
            </div>

            {% if not edit %}
            <h6 class="text-primary mb-3">Initial Tenant Admin</h6>
            <div class="row g-3 mb-4">
                <div class="col-md-4">
                    <label class="form-label">Full Name <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" name="admin_full_name" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Username <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" name="admin_username" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Email <span class="text-danger">*</span></label>
                    <input type="email" class="form-control" name="admin_email" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Temporary Password <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" name="admin_password" required>
                </div>
            </div>
            {% endif %}

            <button type="submit" class="btn btn-primary">
                <i class="bi bi-check-lg"></i> {{ 'Update' if edit else 'Create' }} Tenant
            </button>
            <a href="{{ url_for('tenants') }}" class="btn btn-secondary">
                <i class="bi bi-x-lg"></i> Cancel
            </a>
        </form>
    </div>
</div>
{% endblock %}
