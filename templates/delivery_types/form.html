{% extends 'base.html' %}

{% block title %}{{ 'Edit' if edit else 'Add' }} Delivery Type - Transport Management System{% endblock %}

{% block content %}
<div class="navbar-top">
    <h4 class="mb-0"><i class="bi bi-box-seam"></i> {{ 'Edit' if edit else 'Add' }} Delivery Type</h4>
</div>

<div class="card">
    <div class="card-body p-4">
        <form method="POST">
            {% include '_tenant_selector.html' %}
            <div class="row">
                <div class="col-md-6">
                    <div class="mb-3">
                        <label for="delivery_type" class="form-label">Delivery Type Name <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="delivery_type" name="delivery_type" 
                               value="{{ dt.delivery_type if edit else '' }}" required>
                    </div>
                </div>
            </div>
            <div class="mt-3">
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-check-lg"></i> {{ 'Update' if edit else 'Create' }}
                </button>
                <a href="{{ url_for('delivery_types') }}" class="btn btn-secondary">
                    <i class="bi bi-x-lg"></i> Cancel
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
