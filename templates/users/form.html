{% extends 'base.html' %}

{% block title %}{{ 'Edit' if edit else 'Create' }} User - Transport Management System{% endblock %}

{% block content %}
<div class="navbar-top">
    <h4 class="mb-0"><i class="bi bi-people"></i> {{ 'Edit' if edit else 'Create' }} User</h4>
</div>

<div class="card">
    <div class="card-body p-4">
        <form method="POST">
            {% include '_tenant_selector.html' %}
            <div class="row g-3 mb-4">
                <div class="col-md-4">
                    <label class="form-label">Full Name <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" name="full_name" value="{{ user_obj.full_name if edit else '' }}" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Username <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" name="username" value="{{ user_obj.username if edit else '' }}" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Email <span class="text-danger">*</span></label>
                    <input type="email" class="form-control" name="email" value="{{ user_obj.email if edit else '' }}" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Role <span class="text-danger">*</span></label>
                    <select class="form-select" name="role" required>
                        {% for role in roles %}
                        <option value="{{ role }}" {% if edit and user_obj.role == role %}selected{% endif %}>{{ role_labels.get(role, role) }}</option>
                        {% endfor %}
                    </select>
                </div>
                {% if not edit %}
                <div class="col-md-4">
                    <label class="form-label">Password <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" name="password" required>
                </div>
                {% endif %}
            </div>

            <div class="form-check form-switch mb-4">
                <input class="form-check-input" type="checkbox" id="is_active" name="is_active" {% if (edit and user_obj.is_active) or not edit %}checked{% endif %}>
                <label class="form-check-label" for="is_active">User is active</label>
            </div>

            <button type="submit" class="btn btn-primary">
                <i class="bi bi-check-lg"></i> {{ 'Update' if edit else 'Create' }} User
            </button>
            <a href="{{ url_for('users') }}" class="btn btn-secondary">
                <i class="bi bi-x-lg"></i> Cancel
            </a>
        </form>
    </div>
</div>
{% endblock %}
