{% extends 'base.html' %}

{% block title %}Reset Password - Transport Management System{% endblock %}

{% block content %}
<div class="navbar-top">
    <h4 class="mb-0"><i class="bi bi-key"></i> Reset Password</h4>
    <small class="text-muted">{{ user_obj.full_name }} ({{ user_obj.username }})</small>
</div>

<div class="card">
    <div class="card-body p-4">
        <form method="POST">
            <div class="row g-3 mb-4">
                <div class="col-md-6">
                    <label class="form-label">New Password <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" name="password" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Confirm Password <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" name="confirm_password" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary">
                <i class="bi bi-check-lg"></i> Update Password
            </button>
            <a href="{{ url_for('users') }}" class="btn btn-secondary">
                <i class="bi bi-x-lg"></i> Cancel
            </a>
        </form>
    </div>
</div>
{% endblock %}
