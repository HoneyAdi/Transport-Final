{% if show_tenant_field %}
<div class="row g-3 mb-4">
    <div class="col-md-6">
        <label for="tenant_id" class="form-label">Tenant <span class="text-danger">*</span></label>
        <select class="form-select" id="tenant_id" name="tenant_id" required>
            {% for tenant in tenant_options %}
            <option value="{{ tenant.id }}" {% if selected_tenant_id == tenant.id %}selected{% endif %}>
                {{ tenant.name }}
            </option>
            {% endfor %}
        </select>
        <div class="form-text">Switching the tenant reloads the form with tenant-specific options.</div>
    </div>
</div>
<script>
document.addEventListener('DOMContentLoaded', function () {
    const tenantSelect = document.getElementById('tenant_id');
    if (!tenantSelect) return;
    tenantSelect.addEventListener('change', function () {
        const url = new URL(window.location.href);
        url.searchParams.set('tenant_id', this.value);
        window.location.href = url.toString();
    });
});
</script>
{% endif %}
